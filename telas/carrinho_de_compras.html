<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoAuraChique.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/carrinho_de_compras.css">
    <title>Aura Chique</title>
</head>

<body>
    <header>
        <div id="logo_container">
            <h2><a href="">Aura Chique</a></h2>
        </div>
        <nav id="nav_links">
            <ul id="menu_links">
                <li><a href="">Todos os Produtos</a></li>
                <li><a href="">Feminino</a></li>
                <li><a>Masculino</a></li>
            </ul>
        </nav>
        <nav id="nav_acesso">
            <ul id="acesso_links">
                <li>
                    <a href="">
                        <img src="../img/cart.svg" alt="Ícone de carrinho de compras">
                    </a>
                </li>
                <li>
                    <a href="">
                        <img src="../img/logoLogin.svg" alt="Ícone de usuário">
                        <h3>Login</h3>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <body>
        <section class="carrinho_de_compras">


            <div class="conteiner_titulo_carrinho">
                <h2>Carrinho de Compras</h2>
            </div>
            <div class="conteiner_principal">
                <div class="conteiner_cards">
                    <div class="card_produtos">
                        <div class="img_card">
                            <img src="../img/look.png" alt="">
                        </div>
                        <div class="info_cards">

                            <div class="conteiner_principal_card">
                                <div class="titulo_produto">Calça Wide Leg</div>
                                <div class="remover_produto">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="red"
                                        class="bi bi-trash3-fill" viewBox="0 0 16 16">
                                        <path
                                            d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5" />
                                    </svg>
                                </div>
                            </div>
                            <div class="informacoes_produto">
                                <div class="info_tamanho_cor">
                                    <p>Tamanho 38 | </p>
                                    <p>Color: Black</p>
                                </div>
                                <div class="preco_produto">
                                    <h2>R$ 259,90</h2>
                                </div>
                                <div class="adicionar_remover_produto">
                                    <div class="adicionar">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
                                            <path
                                                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                                            <path
                                                d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                                        </svg>
                                    </div>
                                    <div class="quantidade_produto">
                                        <h3 class="quantidade">2</h3>
                                    </div>
                                    <div class="diminuir">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-dash-circle" viewBox="0 0 16 16">
                                            <path
                                                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                                            <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card_produtos">
                        <div class="img_card">
                            <img src="../img/look.png" alt="">
                        </div>
                        <div class="info_cards">

                            <div class="conteiner_principal_card">
                                <div class="titulo_produto">Calça Wide Leg</div>
                                <div class="remover_produto">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="red"
                                        class="bi bi-trash3-fill" viewBox="0 0 16 16">
                                        <path
                                            d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5" />
                                    </svg>
                                </div>
                            </div>
                            <div class="informacoes_produto">
                                <div class="info_tamanho_cor">
                                    <p>Tamanho 38 | </p>
                                    <p>Color: Black</p>
                                </div>
                                <div class="preco_produto">
                                    <h2>R$ 259,90</h2>
                                </div>
                                <div class="adicionar_remover_produto">
                                    <div class="adicionar">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
                                            <path
                                                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                                            <path
                                                d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                                        </svg>
                                    </div>
                                    <div class="quantidade_produto">
                                        <h3 class="quantidade">2</h3>
                                    </div>
                                    <div class="diminuir">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-dash-circle" viewBox="0 0 16 16">
                                            <path
                                                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                                            <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="conteiner_resumo_pedidos">
                    <div class="conteiner_titulo_resumos">
                        <h2>Resumo Pedidos</h2>
                    </div>
                    <div class="conteiner_frete">
                        <p>Calcular Frete</p>
                        <div class="conteiner_input_frete">
                            <input type="text" placeholder="  00000-000">
                            <button class="botao_frete">OK</button>
                        </div>
                        <div class="total_frete">
                            <p>Subtotal Frete</p>
                            <p>R$ 25,00</p>
                        </div>
                        <div class="total_compra">
                            <h4>Total</h4>
                            <h3 class="preco_total">R$ 449,00</h3>
                        </div>
                    </div>
                    <div class="botoes_finalizar_pedido">
                        <button class="botao_finalizacao">Finalizar Compra</button>
                        <button class="botao_continuar_compras">Continuar Comprando</button>
                    </div>
                </div>



            </div>



        </section>

    </body>
