<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logoAuraChique.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/carrinho_de_compras.css">
    <title>Aura Chique</title>
</head>

<body>
    <header>
        <div id="logo_container">
            <h2><a href="">Aura Chique</a></h2>
        </div>
        <nav id="nav_links">
            <ul id="menu_links">
                <li><a href="">Todos os Produtos</a></li>
                <li><a href="">Feminino</a></li>
                <li><a>Masculino</a></li>
            </ul>
        </nav>
        <nav id="nav_acesso">
            <ul id="acesso_links">
                <li>
                    <a href="">
                        <img src="../img/cart.svg" alt="Ícone de carrinho de compras">
                    </a>
                </li>
                <li>
                    <a href="">
                        <img src="../img/logoLogin.svg" alt="Ícone de usuário">
                        <h3>Login</h3>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <body>
        <section class="carrinho_de_compras">


            <div class="conteiner_titulo_carrinho">
                <h2>Carrinho de Compras</h2>
            </div>
            <div class="conteiner_principal">
                <div class="conteiner_cards">
                    <div class="card_produtos">
                        <div class="img_card">
                            <img src="../img/look.png" alt="">
                        </div>
                        <div class="info_cards">

                            <div class="conteiner_principal_card">
                                <div class="titulo_produto">Calça Wide Leg</div>
                                <div class="remover_produto"><img src="../img/lixo.svg"
                                        alt="Lixeira para remoção de produtos"></div>
                            </div>
                            <div class="informacoes_produto">
                                <div class="info_tamanho_cor">
                                    <p>Tamanho 38 | </p>
                                    <p>Color: Black</p>
                                </div>
                                <div class="preco_produto">
                                    <h2>R$ 259,90</h2>
                                </div>
                                <div class="adicionar_remover_produto">
                                    <div class="adicionar"><img src="../img/botao_adicionar.svg"
                                            alt="Adicionar Produto">
                                    </div>
                                    <div class="diminuir"><img src="../img/botao_diminuir.svg"
                                            alt="    Retirar Produto">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card_produtos">
                        <div class="img_card">
                            <img src="../img/look.png" alt="">
                        </div>
                        <div class="info_cards">

                            <div class="conteiner_principal_card">
                                <div class="titulo_produto">Calça Wide Leg</div>
                                <div class="remover_produto"><img src="../img/lixo.svg"
                                        alt="Lixeira para remoção de produtos"></div>
                            </div>
                            <div class="informacoes_produto">
                                <div class="info_tamanho_cor">
                                    <p>Tamanho 38 | </p>
                                    <p>Color: Black</p>
                                </div>
                                <div class="preco_produto">
                                    <h2>R$ 259,90</h2>
                                </div>
                                <div class="adicionar_remover_produto">
                                    <div class="adicionar"><img src="../img/botao_adicionar.svg"
                                            alt="Adicionar Produto">
                                    </div>
                                    <div class="diminuir"><img src="../img/botao_diminuir.svg"
                                            alt="    Retirar Produto">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="conteiner_resumo_pedidos">
                    <div class="conteiner_titulo_resumos">
                        <h2>Resumo Pedidos</h2>
                    </div>
                    <div class="conteiner_frete">
                        <p>Calcular Frete</p>
                        <div class="conteiner_input_frete">
                            <input type="text" placeholder="  00000-000">
                            <button class="botao_frete">OK</button>
                        </div>
                            <div class="total_frete">
                                <p>Subtotal Frete</p>
                                <p>R$ 25,00</p>
                            </div>
                        <div class="total_compra">
                            <h4>Total</h4>
                            <h3 class="preco_total">R$ 449,00</h3>
                        </div>
                    </div>
                    <div class="botoes_finalizar_pedido">
                        <button class="botao_finalizacao">Finalizar Compra</button>
                        <button class="botao_continuar_compras">Continuar Comprando</button>
                    </div>
                </div>



            </div>



        </section>

    </body>
