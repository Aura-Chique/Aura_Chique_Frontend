<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/meus_pedido.css">
    <link rel="shortcut icon" href="../img/LogoAuraChique.png" type="image/x-icon">
    <title>Aura Chique</title>
</head>

<body>

    <header>
        <div id="logo_container">
            <h2><a href="">Aura Chique</a></h2>
        </div>
        <nav id="nav_links">
            <ul id="menu_links">
                <li><a href="">Todos os Produtos</a></li>
                <li><a href="">Feminino</a></li>
                <li><a>Masculino</a></li>
            </ul>
        </nav>
        <nav id="nav_acesso">
            <ul id="acesso_links">
                <li>
                    <a href="">
                        <img src="../img/cart.svg" alt="Ícone de carrinho de compras">
                    </a>
                </li>
                <li>
                    <a href="">
                        <img src="../img/logoLogin.svg" alt="Ícone de usuário">
                        <h3>Login</h3>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <section class="conteiner_principal_pedidos">

        <div class="conteiner_info">

            <div class="titulo_meus_pedidos">

                <h2>Meus Pedidos</h2>
                <p>Olá Cliente Aura Chique!</p>

            </div>

            <div id="botao_saida_pedidos">
                <button id="sair_pedidos">Sair</button>
            </div>


        </div>


        <div class="card_pedido">

            <div class="card_pedidos_header">
                <div class="informacoes_pedido">
                    <div class="informacoes">
                        <h4>Pedido:</h4>
                        <p>#1001</p>
                    </div>
                    <div class="informacoes2">
                        <h4>Data:</h4>
                        <p> 03/07/2026</p>
                    </div>
                    <div class="informacoes3">
                        <h4>Total:</h4> 
                        <p class="preco">R$226,25</p>
                    </div>
                </div>
                <div class="statusPedido">
                    <h3 class="conteiner_status">Enviado</h3>
                </div>
            </div>
            <div class="detalhes_pedido">

                <div class="conteiner_imagem_produto">
                    <img class="imagem_pedido" src="../img/look.png" alt="Look de Linho">
                </div>
                <div class="info_pedidos">
                    <h3>Conjunto Linho</h3>
                    <div class="detalhamentos_principais">
                        <p>Quantidade: 1 |</p>
                        <p>Tamanho: G |</p>
                        <p>Cor: Bege </p>
                    </div>
                    <div class="preco_principal_produto">
                        <h4>Preço: </h4>
                        <p class="preco">226,56</p>
                    </div>
                </div>

            </div>


        </div>


    </section>

</body>

</html>
